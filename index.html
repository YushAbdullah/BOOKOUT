<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BOOKOUT: a cosy reading game. Walk into a café, library or burger joint, order, and read real free books.">
<meta name="theme-color" content="#F6FEF6">
<title>BOOKOUT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: mint canvas + floating cards for the app shell; each venue is a lit "scene" with real materials (chalkboard, oak desk, lightbox). Light look only, per design.md. */
:root{
  --primary:#6BE683; --on-primary:#003503; --primary-hover:#55D86C; --accent:#1CBB6C;
  --surface:#FFFFFF; --surface-muted:#F6FEF6; --surface-tint:#E3F8E6;
  --ink:#262828; --on-ink:#FFFFFF; --border:#DDEBDF;
  --text:#0F1A12; --text-muted:#4E544F; --text-subtle:#5F655F;
  --success:#1A7F55; --warning:#9A6A00; --danger:#C42A36; --on-danger:#FFFFFF;
  --paper:#FBF6EA; --paper-ink:#2a241b; --paper-soft:#8a8170;
  --font:"Gilroy","Outfit",ui-sans-serif,system-ui,sans-serif;
  --book:"Literata",Georgia,"Iowan Old Style",serif;
  --chalk:"Caveat","Comic Sans MS",cursive;
  --e1:0 4px 16px rgba(16,40,20,.06); --e2:0 12px 32px rgba(16,40,20,.08); --e3:0 24px 60px rgba(16,40,20,.14);
  --r-sm:8px; --r-md:12px; --r-lg:24px;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-muted);color:var(--text);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
.tab{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glow{position:fixed;pointer-events:none;border-radius:50%;filter:blur(90px);background:var(--surface-tint);opacity:.9;z-index:-1}

/* nav */
nav.top{display:flex;align-items:center;gap:16px;padding-block:16px;flex-wrap:wrap}
body.reading nav.top{display:none}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo .dots{position:relative;width:34px;height:22px}
.logo .dots i{position:absolute;top:0;width:22px;height:22px;border-radius:50%}
.logo .dots i:first-child{left:0;background:var(--primary)}
.logo .dots i:last-child{left:12px;background:var(--ink);mix-blend-mode:multiply}
.wordmark{font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}
.wordmark .b{color:var(--accent)} .wordmark .o{color:var(--ink)}
.navlinks{display:flex;gap:24px;margin-left:24px}
.navlinks button{background:none;border:0;padding:8px 0;color:var(--text-muted);font-weight:500;font-size:15px}
.navlinks button[aria-current="page"]{color:var(--text);font-weight:600}
.chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);box-shadow:var(--e1);border-radius:var(--r-md);padding:8px 12px;font-weight:600;font-size:14px;border:0}
.chip small{font-weight:400;color:var(--text-subtle);font-size:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 24px;border-radius:var(--r-sm);border:0;font-weight:500;font-size:15px;transition:transform .1s,background .1s,box-shadow .18s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:var(--on-primary);font-weight:600}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1px var(--text-subtle)}
.btn-ink{background:var(--ink);color:var(--on-ink)}
.btn-danger{background:var(--danger);color:var(--on-danger)}
.btn-sm{min-height:36px;padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:0;color:var(--success);font-weight:600;font-size:14px}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e2);padding:24px}
.muted{color:var(--text-muted)} .subtle{color:var(--text-subtle);font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--text-subtle)}
.bar{height:6px;border-radius:99px;background:var(--surface-tint);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s var(--ease)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface-tint);color:var(--text)}
.pill.open::before,.pill.closed::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--success)}
.pill.closed{background:#FBEDEE}.pill.closed::before{background:var(--danger)}
main{padding-block:8px 64px}
body.reading main{padding-block:8px 24px}
.view{animation:rise .45s var(--ease)}
@keyframes rise{from{opacity:.001;transform:translateY(16px)}to{opacity:1;transform:none}}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px;align-items:center;padding-block:24px 48px}
.hero h1{font-size:clamp(44px,6.4vw,76px);line-height:1.08;letter-spacing:-.03em}
.hero h1 em{font-style:normal;position:relative;white-space:nowrap}
.hero h1 em svg{position:absolute;left:0;bottom:-10px;width:100%;height:16px}
.hero p.lede{font-size:18px;color:var(--text-muted);max-width:480px;margin-top:20px}
.stickers{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.sticker{background:var(--surface);box-shadow:var(--e1);border-radius:var(--r-md);padding:10px 16px;display:flex;align-items:baseline;gap:8px}
.sticker b{font-size:22px;font-weight:600}
.sticker span{font-size:14px;color:var(--text-muted)}
.sticker:nth-child(1){transform:rotate(-4deg)}.sticker:nth-child(2){transform:rotate(2deg)}.sticker:nth-child(3){transform:rotate(-2deg)}
.member{background:var(--ink);color:var(--on-ink);border-radius:var(--r-md);padding:22px;box-shadow:var(--e3);position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column;justify-content:space-between}
.member::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--primary);opacity:.9}
.member::before{content:"";position:absolute;right:30px;top:-30px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);z-index:1}
.member .tier{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;position:relative;z-index:2;max-width:70%}
.member .nm{font-size:22px;font-weight:600;position:relative;z-index:2}
.member .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:13px;position:relative;z-index:2}
.member .bar{background:rgba(255,255,255,.15);margin-top:8px}
.member .bar>i{background:var(--primary)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.section-head h2{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.02em;line-height:1.15}
.venues{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.venue{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e2);overflow:hidden;display:flex;flex-direction:column;transition:transform .28s var(--ease),box-shadow .28s var(--ease);border:0;padding:0;text-align:left}
.venue:hover{transform:translateY(-3px);box-shadow:var(--e3)}
.venue .art{height:170px;position:relative;overflow:hidden}
.venue .art .sign{position:absolute;left:14px;top:14px;z-index:3}
.venue .body{padding:20px 24px 24px;display:grid;gap:8px;flex:1}
.venue h3{font-size:22px}
.venue .kind{font-size:13px;color:var(--text-subtle);font-weight:500}
.venue .rit{font-size:14px;color:var(--text-muted)}
.venue .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--text-subtle)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:48px}
.cont{display:flex;gap:16px;align-items:center}
.quests{display:grid;gap:12px;margin-top:12px}
.quest{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-muted)}
.quest .ck{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--border);font-size:13px;color:var(--on-primary)}
.quest.done .ck{background:var(--primary);box-shadow:none}
.quest div{flex:1;min-width:0}
.quest b{font-weight:600;font-size:15px}
.quest .pts{font-size:13px;font-weight:600;color:var(--success)}

/* ---------- scenes ---------- */
.scene{position:relative;height:clamp(260px,38vw,360px);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--e3);isolation:isolate}
.scene .layer{position:absolute;inset:0}
.scene.mini{height:100%;border-radius:0;box-shadow:none}
/* café */
.sc-cafe{background:linear-gradient(180deg,#E9D5BC 0%,#DDBF9C 62%,#7A4E2E 62%,#6A4226 100%)}
.sc-cafe .win{position:absolute;left:8%;top:12%;width:38%;height:44%;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#BFE3F2,#F7E7C6);box-shadow:inset 0 0 0 8px #F4EBDD,0 8px 24px rgba(60,30,10,.18);overflow:hidden}
.sc-cafe .win::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,#F4EBDD 48% 52%,transparent 52%),linear-gradient(180deg,transparent 48%,#F4EBDD 48% 52%,transparent 52%)}
.sc-cafe .win::after{content:"";position:absolute;left:-20%;top:-10%;width:140%;height:140%;background:linear-gradient(115deg,rgba(255,255,255,.45) 0 12%,transparent 12% 20%,rgba(255,255,255,.25) 20% 26%,transparent 26%)}
.night .sc-cafe .win,.night .win{background:linear-gradient(180deg,#1E2A4A,#3B3560)}
.sc-cafe .lamp{position:absolute;top:0;width:2px;height:22%;background:#3a2a1e}
.sc-cafe .lamp::after{content:"";position:absolute;left:-18px;bottom:-18px;width:38px;height:22px;border-radius:38px 38px 4px 4px;background:#2F3A33;box-shadow:0 18px 40px 16px rgba(255,214,140,.55)}
.sc-cafe .board{position:absolute;right:7%;top:12%;width:30%;height:40%;background:#2F3A33;border:6px solid #8A5A3C;border-radius:6px;color:#F4F1E8;font:700 clamp(16px,2.2vw,24px)/1.1 var(--chalk);padding:10px 12px;transform:rotate(1.5deg)}
.sc-cafe .board small{display:block;font-size:.7em;opacity:.8;margin-top:4px}
.sc-cafe .props{position:absolute;right:6%;bottom:40%;font-size:clamp(22px,3vw,34px);display:flex;gap:10px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.sc-cafe .counter{position:absolute;left:0;right:0;bottom:0;height:38%;background:repeating-linear-gradient(90deg,#7A4E2E 0 46px,#73482A 46px 48px),#7A4E2E;box-shadow:inset 0 10px 0 #5A3620}
/* library */
.sc-library{background:#2E4A3A}
.sc-library .shelves{position:absolute;inset:0 0 34% 0;background:
  repeating-linear-gradient(180deg,transparent 0 calc(33.33% - 10px),#6B4426 calc(33.33% - 10px) 33.33%),
  repeating-linear-gradient(90deg,#7A2E2E 0 14px,#2E4A6B 14px 26px,#C9A227 26px 30px,#3B5B3A 30px 46px,#5E2E4A 46px 56px,#E9DFC7 56px 62px,#6B4E2E 62px 78px,#263238 78px 88px,#8A6A2E 88px 104px,#2E5E5E 104px 116px,#4A3B6B 116px 130px,transparent 130px 136px);
  opacity:.92}
.sc-library .shelves::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,30,24,.15),rgba(20,30,24,.45))}
.sc-library .clock{position:absolute;left:50%;top:9%;transform:translateX(-50%);width:clamp(64px,9vw,92px);aspect-ratio:1;max-width:100%;border-radius:50%;background:#F7F1E3;border:5px solid #6B4426;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:2}
.sc-library .clock i{position:absolute;left:50%;bottom:50%;width:3px;background:#1d1d1d;transform-origin:50% 100%;border-radius:3px}
.sc-library .lampg{position:absolute;right:10%;bottom:34%;font-size:clamp(26px,3.6vw,40px);filter:drop-shadow(0 0 18px rgba(255,220,140,.8))}
.sc-library .counter{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,#8A5A36,#6B4426);box-shadow:inset 0 8px 0 #A06B42}
/* diner */
.sc-diner{background:conic-gradient(#FFF6E3 25%,#FBE7BE 0 50%,#FFF6E3 0 75%,#FBE7BE 0) 0 0/36px 36px}
.sc-diner .band{position:absolute;left:0;right:0;top:0;height:16%;background:#D9483B;box-shadow:0 6px 0 #F6B93B}
.sc-diner .neon{position:absolute;left:8%;top:24%;font:800 clamp(18px,2.6vw,28px)/1 var(--font);color:#FF6B5E;text-shadow:0 0 6px #FF6B5E,0 0 18px #FF6B5E;border:3px solid #FF6B5E;border-radius:10px;padding:8px 12px;box-shadow:0 0 14px #FF6B5E,inset 0 0 10px #FF6B5E;background:rgba(40,10,10,.75);animation:buzz 6s infinite}
@keyframes buzz{0%,92%,96%,100%{opacity:1}94%{opacity:.4}}
.sc-diner .screen{position:absolute;right:6%;top:22%;width:40%;height:32%;background:#151515;border-radius:6px;box-shadow:0 8px 18px rgba(0,0,0,.25);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center;font-size:clamp(18px,2.6vw,30px);padding:6px}
.sc-diner .counter{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,#B9B9B9,#8E8E8E);box-shadow:inset 0 8px 0 #D6D6D6}
.sc-diner .props{position:absolute;right:8%;bottom:30%;font-size:clamp(24px,3.2vw,36px);display:flex;gap:8px}
.night .scene::after,.scene.night::after{content:"";position:absolute;inset:0;background:rgba(20,24,60,.18);pointer-events:none;z-index:4}
/* staff */
.staff{position:absolute;left:4%;bottom:6%;display:flex;align-items:flex-end;gap:12px;z-index:5;right:4%}
.avatar{flex:none;width:clamp(72px,10vw,104px);aspect-ratio:1;border-radius:50%;background:var(--primary);display:grid;place-items:center;font-size:clamp(44px,6vw,64px);box-shadow:0 8px 20px rgba(0,0,0,.25),inset 0 -6px 0 rgba(0,0,0,.08);animation:bob 3.2s ease-in-out infinite}
.avatar.talking{animation:talk .28s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes talk{to{transform:translateY(-3px) scale(1.03)}}
.bubble{position:relative;background:var(--surface);border-radius:16px;padding:12px 16px;box-shadow:0 10px 24px rgba(0,0,0,.18);max-width:min(520px,100%);min-width:0;margin-bottom:18px}
.bubble::before{content:"";position:absolute;left:-8px;bottom:14px;width:16px;height:16px;background:var(--surface);transform:rotate(45deg);border-radius:3px}
.bubble b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}
.bubble p{font-size:clamp(15px,1.6vw,18px);font-weight:500;min-height:1.5em}
.bubble p::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--accent);margin-left:2px}
.bubble p.done::after{content:""}
@keyframes blink{50%{opacity:0}}
.scene-top{display:flex;justify-content:space-between;align-items:center;position:absolute;left:14px;right:14px;top:12px;z-index:6;gap:8px}
.scene-top .pill{background:rgba(255,255,255,.92)}
.voice-btn{background:rgba(255,255,255,.92);border:0;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}

/* counters: real materials */
.station{margin-top:20px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px;align-items:start}
.chalk{background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.06),transparent 60%),#2F3A33;border:12px solid #8A5A3C;border-radius:12px;box-shadow:var(--e3),inset 0 0 40px rgba(0,0,0,.35);padding:22px;color:#F4F1E8}
.chalk h3{font:700 34px/1 var(--chalk);margin-bottom:12px}
.chalk .row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:inherit;padding:10px 8px;border-radius:12px;text-align:left;font:600 24px/1.1 var(--chalk);position:relative}
.chalk .row .em{font-size:28px;font-family:var(--font)}
.chalk .row .dots{flex:1;border-bottom:2px dotted rgba(244,241,232,.4);transform:translateY(-6px);min-width:12px}
.chalk .row small{display:block;font:500 15px/1.2 var(--font);opacity:.7}
.chalk .row[aria-pressed="true"]{outline:2.5px dashed #F4F1E8;outline-offset:-2px;background:rgba(255,255,255,.05)}
.chalk .row:hover{background:rgba(255,255,255,.06)}
.oak{background:repeating-linear-gradient(92deg,rgba(0,0,0,.035) 0 3px,transparent 3px 11px),linear-gradient(180deg,#B07A4C,#93603A);border-radius:16px;padding:22px;box-shadow:var(--e3),inset 0 6px 0 rgba(255,255,255,.15);color:#fff}
.oak h3{font-size:20px;margin-bottom:14px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.ticket{position:relative;border:0;background:radial-gradient(circle at 0 50%,transparent 9px,#FFF8E6 10px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 9px,#FFF8E6 10px) right/51% 100% no-repeat;color:#3a2a1e;padding:14px 16px;text-align:left;border-radius:6px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));display:grid;gap:2px;transition:transform .18s}
.ticket:hover{transform:translateY(-2px) rotate(-1deg)}
.ticket .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a6a4a;font-weight:600}
.ticket b{font-size:20px;font-weight:700}
.ticket span{font-size:12px;color:#7a6650}
.ticket .stamp-mark{position:absolute;right:6px;top:8px;font:800 12px/1 var(--font);color:#C42A36;border:2px solid #C42A36;border-radius:6px;padding:4px 6px;transform:rotate(-14deg) scale(2);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .15s}
.ticket[aria-pressed="true"] .stamp-mark{opacity:.9;transform:rotate(-14deg) scale(1)}
.ticket:disabled{opacity:.45;cursor:not-allowed}
.lightbox{background:#121212;border-radius:16px;padding:18px;box-shadow:var(--e3),inset 0 0 0 4px #2a2a2a;color:#fff}
.lightbox h3{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:#F6B93B;margin-bottom:12px}
.lbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.lbitem{border:0;border-radius:12px;background:radial-gradient(circle at 50% 35%,#3a2a1a,#1c1c1c 70%);color:#fff;padding:14px;display:grid;gap:4px;justify-items:center;text-align:center;box-shadow:inset 0 0 0 1px #2e2e2e;transition:box-shadow .18s,transform .18s}
.lbitem .em{font-size:48px;filter:drop-shadow(0 6px 10px rgba(255,180,60,.35));transition:transform .25s}
.lbitem:hover .em{transform:scale(1.08) rotate(-4deg)}
.lbitem b{font-weight:600}
.lbitem span{font-size:12px;color:#F6B93B}
.lbitem[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--primary),0 0 22px rgba(107,230,131,.35)}
.orderno{display:inline-flex;margin-top:12px;background:#F6B93B;color:#2a1a00;font-weight:800;border-radius:8px;padding:6px 12px}
.nook{display:grid;gap:14px}
.nook .shelfstrip{height:150px;border-radius:12px;background:linear-gradient(180deg,#F1E6D3,#E7D7BC);position:relative;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:0 16px 14px;overflow:hidden}
.nook .shelfstrip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(180deg,#8A5A36,#6B4426)}
.tier-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tierc{border-radius:10px;padding:10px;background:rgba(255,255,255,.12);display:grid;gap:4px;font-size:12px;align-content:start}

.borrow-list{display:grid;gap:8px;margin-top:10px}
.borrow-row{display:flex;align-items:center;gap:10px;font-size:14px;background:var(--surface-muted);border-radius:var(--r-sm);padding:8px 10px;color:var(--text);border:0;text-align:left;width:100%}
.oak .borrow-row{background:rgba(255,255,255,.9)}

/* ---------- book covers & spines ---------- */
.cloth{position:relative;width:var(--cw,120px);aspect-ratio:2/3;max-width:100%;border-radius:3px 6px 6px 3px;background:linear-gradient(90deg,rgba(0,0,0,.25) 0 6%,rgba(255,255,255,.08) 6% 7%,transparent 7%),var(--c);box-shadow:0 10px 24px rgba(0,0,0,.25);overflow:hidden;color:#F5E9C8;flex:none}

.cloth .cl-in b{font:600 clamp(11px,calc(var(--cw,120px)/9),18px)/1.2 var(--book);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cloth .cl-in span{font:400 clamp(9px,calc(var(--cw,120px)/13),12px)/1.2 var(--font);opacity:.85}
.cloth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.case{background:linear-gradient(180deg,#6B4426,#5A3820);border-radius:20px;padding:16px;box-shadow:var(--e3)}
.plates{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.plate{flex:none;border:0;border-radius:6px;padding:7px 12px;background:linear-gradient(180deg,#E9C46A,#C9A227);color:#3a2a00;font-weight:600;font-size:13px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.25)}
.plate[aria-pressed="true"]{background:linear-gradient(180deg,#FFF1C2,#F6D365);outline:2px solid #FFF1C2;outline-offset:2px}
.case .search{display:flex;gap:8px;margin:10px 0 4px}
.case .search input{flex:1;min-width:0;height:44px;border-radius:8px;border:0;padding:0 14px;background:#FFF8E6}
.shelf{position:relative;display:flex;align-items:flex-end;gap:3px;padding:18px 12px 0;min-height:220px;overflow-x:auto;overflow-y:hidden;background:linear-gradient(180deg,#3E2716,#4A2F1B);border-radius:6px 6px 0 0;margin-top:14px;scrollbar-width:thin}
.shelf-board{height:16px;background:linear-gradient(180deg,#A06B42,#7A4E2E);border-radius:0 0 6px 6px;box-shadow:0 6px 10px rgba(0,0,0,.35)}
.shelf-label{color:#F5E9C8;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-top:14px;display:flex;justify-content:space-between;gap:8px}
.spine{flex:none;width:var(--w);height:var(--h);border:0;padding:10px 0;border-radius:3px 3px 0 0;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12) 30%,rgba(0,0,0,.05) 70%,rgba(0,0,0,.3)),var(--c);color:#F5E9C8;writing-mode:vertical-rl;text-orientation:mixed;font:600 12px/1.1 var(--book);display:flex;align-items:center;justify-content:flex-start;overflow:hidden;position:relative;transition:transform .25s var(--ease);box-shadow:inset 0 10px 0 -6px rgba(233,196,106,.7),inset 0 -14px 0 -10px rgba(233,196,106,.7)}
.spine span{max-height:calc(var(--h) - 28px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.spine:hover{transform:translateY(-8px)}
.spine.out{transform:translateY(-26px) rotate(-3deg)}
.spine.ghost{background:repeating-linear-gradient(90deg,#3a2a1e 0 2px,#4a3424 2px 4px);opacity:.5;cursor:default}
.pulled{display:flex;gap:18px;align-items:flex-start;background:#FFF8E6;border-radius:14px;padding:16px;margin-top:14px;animation:rise .3s var(--ease)}
.pulled .info{flex:1;min-width:0;display:grid;gap:6px}
.pulled h3{font:600 20px/1.25 var(--book)}
.fetching{color:#F5E9C8;font-size:13px;display:flex;gap:8px;align-items:center;padding:10px 4px}
.fetching i{width:14px;height:14px;border-radius:50%;border:2px solid #F5E9C8;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- reading room ---------- */
.hud{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-radius:16px;box-shadow:var(--e2);margin-bottom:14px;flex-wrap:wrap}
.hud .mini{width:44px;height:44px;flex:none;display:grid;place-items:center}
.hud .t{display:grid;line-height:1.15}
.hud .t b{font-size:22px;font-weight:600}
.hud .t span{font-size:12px;color:var(--text-subtle)}
.hud .sp{flex:1}
.hud .hb{border:0;background:var(--surface-muted);border-radius:10px;min-width:40px;height:40px;padding:0 10px;font-size:15px;font-weight:600;box-shadow:inset 0 0 0 1px var(--border)}
.desk{border-radius:24px;padding:clamp(14px,3vw,36px) clamp(8px,2vw,24px);display:grid;place-items:center;position:relative;overflow:hidden}
.desk.cafe{background:repeating-linear-gradient(92deg,rgba(0,0,0,.04) 0 3px,transparent 3px 13px),linear-gradient(160deg,#9A6A44,#7A4E2E)}
.desk.library{background:radial-gradient(ellipse at 50% 0%,rgba(255,226,150,.25),transparent 60%),linear-gradient(160deg,#2F5240,#22392C)}
.desk.diner{background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 8px),linear-gradient(160deg,#D9483B,#B93A2F)}
.desk .prop{position:absolute;font-size:clamp(34px,5vw,56px);filter:drop-shadow(0 10px 10px rgba(0,0,0,.3));pointer-events:none;z-index:0}
.book{position:relative;display:flex;perspective:2600px;z-index:1;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.book::before{content:"";position:absolute;inset:-8px -10px -10px;background:var(--cover,#2E4A6B);border-radius:8px;box-shadow:0 30px 60px rgba(0,0,0,.35);z-index:-1}
.pg{position:relative;width:var(--pw);height:var(--ph);background:var(--paper);padding:var(--pad-t,40px) var(--pad-x,38px) 26px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.pg.l{border-radius:4px 0 0 4px;background:linear-gradient(to left,rgba(60,40,10,.16),rgba(60,40,10,0) 9%),var(--paper);box-shadow:-1px 0 0 #e9e1cd,-2px 0 0 #fbf6ea,-3px 0 0 #e4dbc5,-4px 0 0 #f7f1e3,-5px 1px 0 #ddd3bb}
.pg.r{border-radius:0 4px 4px 0;background:linear-gradient(to right,rgba(60,40,10,.16),rgba(60,40,10,0) 9%),var(--paper);box-shadow:1px 0 0 #e9e1cd,2px 0 0 #fbf6ea,3px 0 0 #e4dbc5,4px 0 0 #f7f1e3,5px 1px 0 #ddd3bb}
.pg.solo{border-radius:3px 6px 6px 3px;background:linear-gradient(to right,rgba(60,40,10,.14),rgba(60,40,10,0) 5%),var(--paper)}
.rh{font:italic 400 12px/1.2 var(--book);color:var(--paper-soft);text-align:center;letter-spacing:.04em;margin-bottom:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.pgc{flex:1;min-height:0;overflow:hidden;font-family:var(--book);font-size:var(--fs,18px);line-height:1.6;color:var(--paper-ink);hyphens:auto;-webkit-hyphens:auto;text-align:justify;overflow-wrap:break-word}
.pgc p{margin:0;text-indent:1.4em}
.narrow .pgc,.narrow .leaf .pgc{text-align:left;hyphens:auto}
.pgc p.cont,.pgc p.first{text-indent:0}
.pgc p.first::first-letter{float:left;font-size:3.1em;line-height:.85;padding:.08em .1em 0 0;color:#1A5E40;font-weight:600}
.pgc h4{font:600 1.02em/1.3 var(--font);text-align:center;margin:1.4em 0 1.1em;letter-spacing:.03em;color:#1d1a14;text-wrap:balance}
.pgc h4:first-child{margin-top:.6em}
.pgc p.verse{white-space:pre-line;text-indent:0;text-align:left;margin:0 0 1em}
.pgc .end{text-align:center;font:italic 1em var(--book);color:var(--paper-soft);margin-top:2em}
.folio{font:400 12px/1 var(--book);color:var(--paper-soft);text-align:center;margin-top:10px;flex:none}
.measure{position:absolute!important;left:-99999px;top:0;visibility:hidden;pointer-events:none}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:6;transition:transform .7s cubic-bezier(.4,.1,.25,1),opacity .7s}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .face>.pg{width:100%;height:100%}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.18));opacity:0;animation:shade .7s ease-in-out}
@keyframes shade{50%{opacity:1}}
.leaf .cover-face{width:100%;height:100%;border-radius:3px 8px 8px 3px;background:linear-gradient(90deg,rgba(0,0,0,.3) 0 5%,rgba(255,255,255,.1) 5% 6%,transparent 6%),var(--cover);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#F5E9C8;padding:14%;gap:14px}
.leaf .cover-face b{font:600 clamp(20px,3vw,32px)/1.2 var(--book)}
.leaf .cover-face span{font-size:14px;opacity:.85}
.leaf .cover-face::before{content:"";position:absolute;inset:7% 7% 7% 10%;border:2px solid rgba(245,233,200,.55);border-radius:2px}
.leaf .endpaper{width:100%;height:100%;background:repeating-linear-gradient(45deg,#E8DCC0 0 6px,#EFE4CB 6px 12px);display:grid;place-items:center}
.bookplate{background:var(--paper);border:1.5px solid #B9A77F;border-radius:6px;padding:16px 20px;text-align:center;font:italic 14px/1.4 var(--book);color:#5a4d33;max-width:80%}
.booknav{display:flex;align-items:center;gap:12px;margin-top:16px;width:100%;max-width:1100px;z-index:1;position:relative}
.booknav .bar{flex:1;background:rgba(255,255,255,.25)}
.booknav .bar>i{background:var(--primary)}
.booknav .pct{color:#fff;font-size:13px;min-width:44px;text-align:right;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.navbtn{border:0;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);font-size:20px;box-shadow:0 4px 10px rgba(0,0,0,.2);flex:none}
.navbtn:disabled{opacity:.35}
.under{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--e1)}
.stat b{display:block;font-size:20px;font-weight:600}
.stat span{font-size:12px;color:var(--text-subtle)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statgrid .stat{background:var(--surface-muted);box-shadow:none}
.tray{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:15px;max-width:120px}
.tray span{transition:opacity .45s,transform .45s}
.tray span.gone{opacity:.15;transform:scale(.7);filter:grayscale(1)}
.paused-veil{position:absolute;inset:0;background:rgba(20,26,22,.6);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:9;text-align:center;padding:24px;color:#fff;border-radius:24px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,26,18,.45);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;animation:fadein .18s}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e3);width:min(560px,100%);max-height:100%;overflow:auto;padding:28px;animation:rise .28s var(--ease)}
.modal.wide{width:min(1000px,100%);background:transparent;box-shadow:none;padding:0}
.modal h2{font-size:26px;letter-spacing:-.01em;line-height:1.2}
.modal .em{font-size:52px;line-height:1;margin-bottom:12px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
.say{display:flex;gap:12px;align-items:flex-start;margin-top:4px}
.say .avatar{width:60px;font-size:36px;animation:none}
.say .bubble{margin:0;box-shadow:none;background:var(--surface-muted);flex:1}
.say .bubble::before{background:var(--surface-muted);top:18px;bottom:auto}
.countdown{font-size:56px;font-weight:600;letter-spacing:-.02em;margin:16px 0 4px}

/* passport */
.pp-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.bdg{background:var(--surface-muted);border-radius:var(--r-md);padding:14px;text-align:center;display:grid;gap:4px;font-size:12px;color:var(--text-subtle)}
.bdg .e{font-size:32px}
.bdg b{font-size:14px;color:var(--text)}
.bdg.locked .e{filter:grayscale(1);opacity:.35}
.bdg.got{background:var(--surface);box-shadow:inset 0 0 0 2px var(--primary)}
.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px dashed var(--border);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--text-subtle);padding:8px}
.stamp.got{border:2px solid var(--accent);color:var(--text);transform:rotate(-6deg);background:var(--surface)}
.stamp .e{font-size:28px;display:block}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.gallery img{width:100%;border-radius:8px;box-shadow:var(--e1)}
.field{display:grid;gap:6px;font-size:14px;font-weight:500}
.field .search{display:flex;gap:8px}
.field input{flex:1;min-width:0;height:44px;border-radius:var(--r-sm);border:1px solid var(--border);padding:0 12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--success)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:8px;z-index:60;width:min(340px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--on-ink);border-radius:var(--r-md);padding:12px 16px;box-shadow:var(--e3);display:flex;gap:10px;align-items:center;font-size:14px;animation:rise .28s var(--ease)}
.toast b{color:var(--primary)}

@media (max-width:1023px){
  .hero,.row2,.pp-grid,.station{grid-template-columns:1fr}
  .venues{grid-template-columns:1fr 1fr}
  .under{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:639px){
  .venues{grid-template-columns:1fr}
  .navlinks{margin-left:0;order:3;width:100%}
  .tier-row{grid-template-columns:1fr}
  .modal{padding:22px}
  .scene{height:300px}
  .staff{left:3%;right:3%}
  .bubble p{font-size:15px}
  .sc-cafe .board{display:none}
  .hud .t b{font-size:18px}
  .pulled{flex-direction:column;align-items:center;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(() => {

  const before = levelInfo(S.xp).lvl;
  S.points += pts; S.xp += pts;
  if (sess) sess.earned += pts;
  if (!quiet) { toast(`<b>+${pts}</b> ${esc(reason)}`); sfx('coin'); }
  if (levelInfo(S.xp).lvl > before) { sfx('win'); toast(`🎉 Level ${levelInfo(S.xp).lvl}: <b>${esc(levelInfo(S.xp).title)}</b>`, 4500); }
  save(); renderChips(); return pts;
}
function checkBadges() {
  const got = [];
  BADGES.forEach(b => { if (!S.badges[b.id] && b.test(S)) { S.badges[b.id] = dayKey(); got.push(b); } });
  got.forEach(b => { toast(`${b.e} Badge unlocked: <b>${esc(b.name)}</b>`, 5000); earn(20, 'badge bonus', true); });
  if (got.length) { sfx('win'); save(); }
  return got;
}
function minuteRead(venueId) {
  rollDay();
  const t = dayKey();
  if (S.lastDay !== t) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    S.streak = S.lastDay === dayKey(y) ? S.streak + 1 : 1; S.best = Math.max(S.best, S.streak); S.lastDay = t;
    earn(Math.min(5 * S.streak, 50), `day ${S.streak} streak bonus`);
  }

  const h = new Date().getHours(); if (h >= 22) S.flags.owl = true; if (h < 8) S.flags.early = true;
  earn(venueId === 'library' ? TIERS[S.member].mult : 1, 'minute read', true);

}
function quests() {

    { id: 'brk', label: 'Take a break when the staff ask', pts: 10, done: !!S.quests.brk },

function questCheck() { quests().forEach(q => { if (q.done && !S.quests['paid_' + q.id]) { S.quests['paid_' + q.id] = 1; earn(q.pts, `daily quest: ${q.label.toLowerCase()}`); } }); }
function venueStatus(v) {
  const now = new Date(), h = now.getHours() + now.getMinutes() / 60;
  if (v.close - v.open >= 24) return { open: true, label: 'Open 24 hours', minsLeft: Infinity };
  if (!S.settings.hours || (v.id === 'library' && S.member === 'gold')) return { open: true, label: 'Open now', minsLeft: Infinity };
  const open = h >= v.open && h < v.close;
  return open ? { open, label: `Open · closes ${hourLabel(v.close)}`, minsLeft: Math.floor((v.close - h) * 60) } : { open, label: `Closed · opens ${hourLabel(v.open)}`, minsLeft: 0 };
}

/* =============== books: free sources =============== */
const GUTENDEX = 'https://gutendex.com/books/';
const PROXIES = [u => u, u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u), u => 'https://corsproxy.io/?url=' + encodeURIComponent(u), u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u)];
// Try the direct link first, then free CORS proxies in parallel (staggered). First good answer wins.
function race(url, as = 'text', ms = 25000) {
  const ctrls = [];
  const tries = PROXIES.map((p, i) => new Promise((res, rej) => setTimeout(async () => {
    if (done) return rej(new Error('cancelled'));
    const c = new AbortController(); ctrls.push(c); const t = setTimeout(() => c.abort(), ms);
    try { const r = await fetch(p(url), { signal: c.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); const body = as === 'json' ? await r.json() : await r.text(); if (as !== 'json' && body.length < 800) throw new Error('empty'); res(body); }
    catch (e) { rej(e); } finally { clearTimeout(t); }
  }, i === 0 ? 0 : 900 + i * 700)));
  let done = false;
  return Promise.any(tries).then(v => { done = true; ctrls.forEach(c => c.abort()); return v; }, () => { throw new Error('the free book servers did not answer'); });
}
const gbook = (id, title, author, cat) => ({ key: 'g:' + id, src: 'gutenberg', id, title, author, cat,
  cover: `https://www.gutenberg.org/cache/epub/${id}/pg${id}.cover.medium.jpg`, txt: `https://www.gutenberg.org/cache/epub/${id}/pg${id}.txt`, page: `https://www.gutenberg.org/ebooks/${id}` });
function fromGutendex(b, cat) {
  const f = b.formats || {}; const k = Object.keys(f).find(k => k.startsWith('text/plain') && !f[k].endsWith('.zip'));
  const bk = gbook(b.id, b.title.replace(/\s*[:;]\s*$/, ''), (b.authors || []).map(a => a.name.split(', ').reverse().join(' ')).join(', ') || 'Unknown', cat);
  if (k) bk.txt = f[k].replace(/^http:/, 'https:'); if (f['image/jpeg']) bk.cover = f['image/jpeg'];
  return k ? bk : null;
}
async function browse(cat, q) {
  const ck = 'bookout:cat:' + (q ? 'q:' + q.toLowerCase() : cat);
  const cached = store(ck); if (cached && Date.now() - cached.t < 3 * 864e5) return cached.books;
  const p = new URLSearchParams({ languages: 'en', mime_type: 'text/plain' });
  if (q) p.set('search', q); else p.set('topic', CATS.find(c => c.id === cat).topic);
  const data = await race(GUTENDEX + '?' + p, 'json', 30000);
  const books = (data.results || []).map(b => fromGutendex(b, cat || 'search')).filter(Boolean);
  store(ck, { t: Date.now(), books });
  return books;
}
function cleanText(t) {
  t = t.replace(/\r/g, '').replace(/^﻿/, '');
  const s = t.search(/\*\*\*\s*START OF (THE|THIS) PROJECT GUTENBERG[^\n]*/i); if (s >= 0) t = t.slice(t.indexOf('\n', s) + 1);
  const e = t.search(/\*\*\*\s*END OF (THE|THIS) PROJECT GUTENBERG/i); if (e >= 0) t = t.slice(0, e);
  t = t.replace(/\[Illustration[^\]]*\]/gi, '').replace(/_([^_\n]+)_/g, '$1');
  return t.trim();
}
function toBlocks(text) {
  const out = [];
  text.split(/\n\s*\n/).forEach(raw => {
    raw = raw.replace(/^\s+|\s+$/g, ''); if (!raw) return;
    const lines = raw.split('\n'); const single = lines.map(l => l.trim()).join(' ');
    const isHead = single.length < 80 && (/^(chapter|book|part|letter|stave|act|scene|canto|section|volume)\b[\s.:]/i.test(single + ' ') || (/[A-Z]/.test(single) && single === single.toUpperCase() && single.length < 60 && !/[.,;]$/.test(single)));
    if (isHead) { out.push({ t: single.replace(/\s+/g, ' '), h: 1, pb: /^(chapter|book|part|stave|act|canto|letter)\b/i.test(single) ? 1 : 0 }); return; }
    const avg = raw.length / lines.length;
    if (lines.length >= 3 && avg < 55) out.push({ t: lines.map(l => l.trim()).join('\n'), v: 1 });
    else out.push({ t: single.replace(/\s+/g, ' ') });
  });
  for (let i = 0; i < out.length; i++) if (out[i].h && out[i + 1] && !out[i + 1].h && !out[i + 1].v) out[i + 1].first = 1;
  if (out[0] && !out[0].h && !out[0].v) out[0].first = 1;
  return out;
}
async function loadBlocks(book) {
  if (book.src === 'local') {
    const b = [];
    POEMS.poems.forEach(([t, by, ...st]) => { b.push({ t, h: 1, pb: 1 }); b.push({ t: by, v: 1, by: 1 }); st.forEach(s => b.push({ t: s, v: 1 })); });
    return b;
  }
  const ck = 'bookout:text:' + book.key;
  let text = null; try { text = localStorage.getItem(ck); } catch (e) {}
  if (!text) {
    text = cleanText(await race(book.txt, 'text', 45000));
    try { Object.keys(localStorage).filter(k => k.startsWith('bookout:text:')).forEach(k => localStorage.removeItem(k)); localStorage.setItem(ck, text); } catch (e) {}
  }
  return toBlocks(text);
}
function rememberBook(b) {
  const lite = { key: b.key, src: b.src, id: b.id, title: b.title, author: b.author, cat: b.cat, cover: b.cover, txt: b.txt, page: b.page };
  S.recent = [lite, ...S.recent.filter(x => x.key !== b.key)].slice(0, 8);
  if (b.cat && CATS.find(c => c.id === b.cat) && !S.genres.includes(b.cat)) S.genres.push(b.cat);

}

let typing = null;
function talk(text, sound = true) {
  const p = $('#say-text'), av = $('#staff-av'); if (!p) return;
  clearInterval(typing); p.classList.remove('done'); p.textContent = '';
  const v = VENUES[setup ? setup.venue : sess.venue]; speak(text, v.staff.name);

    if (s.hist.length) s.pos = s.hist.pop();
    else { const want = old.L.html.length * (spread ? 2 : 1); let b = s.pos.b, acc = 0; while (b > 0 && acc < want) { b--; acc += s.blocks[b].t.length; } s.pos = { b, w: 0 }; }
  }
  const nv = computeView(s.pos); s.view = nv;
  if (dir > 0 && !old.end) { const n = spread ? 2 : 1; s.pagesRead += n; S.pages += n; checkBadges(); if (nv.end && !s.lastEnded) { s.lastEnded = true; earn(30, 'reached the last page'); } }
  sfx('flip');
  const book = $('#book');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { paintView(nv); updHud(); return; }
  flipping = true;
  const leaf = document.createElement('div'); leaf.className = 'leaf';
  const done = () => { leaf.remove(); paintView(nv); flipping = false; updHud(); };
  if (spread) {
    if (dir > 0) { leaf.style.left = 'var(--pw)'; leaf.style.transformOrigin = 'left center'; leaf.innerHTML = `<div class="face"><div class="pg r">${pageHTML(old.R, 'R')}</div></div><div class="face back"><div class="pg l">${pageHTML(nv.L, 'L')}</div></div>`; book.append(leaf); paintView(nv, 'R'); $('#pgL').innerHTML = pageHTML(old.L, 'L'); }
    else { leaf.style.left = '0'; leaf.style.transformOrigin = 'right center'; leaf.innerHTML = `<div class="face"><div class="pg l">${pageHTML(old.L, 'L')}</div></div><div class="face back"><div class="pg r">${pageHTML(nv.R, 'R')}</div></div>`; book.append(leaf); paintView(nv, 'L'); $('#pgR').innerHTML = pageHTML(old.R, 'R'); }
    requestAnimationFrame(() => requestAnimationFrame(() => { leaf.style.transform = `rotateY(${dir > 0 ? -180 : 180}deg)`; }));
  } else {
    leaf.style.left = '0'; leaf.style.transformOrigin = 'left center';
    if (dir > 0) { leaf.innerHTML = `<div class="face"><div class="pg solo">${pageHTML(old.L, 'L')}</div></div>`; book.append(leaf); paintView(nv);
      requestAnimationFrame(() => requestAnimationFrame(() => { leaf.style.transform = 'rotateY(-165deg)'; leaf.style.opacity = '0'; })); }
    else { leaf.innerHTML = `<div class="face"><div class="pg solo">${pageHTML(nv.L, 'L')}</div></div>`; leaf.style.transition = 'none'; leaf.style.transform = 'rotateY(-165deg)'; leaf.style.opacity = '0'; book.append(leaf);
      requestAnimationFrame(() => requestAnimationFrame(() => { leaf.style.transition = ''; leaf.style.transform = 'rotateY(0)'; leaf.style.opacity = '1'; })); }
  }
  setTimeout(done, 720);
}
function openCover() {
  const s = sess, book = $('#book'); if (!book || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const spread = isSpread(); flipping = true;
  const leaf = document.createElement('div'); leaf.className = 'leaf'; leaf.style.left = spread ? 'var(--pw)' : '0'; leaf.style.transformOrigin = 'left center'; leaf.style.transition = 'transform 1.1s cubic-bezier(.5,.05,.25,1), opacity 1.1s';
  leaf.innerHTML = `<div class="face"><div class="cover-face" style="--cover:${clothOf(s.book)}"><b>${esc(s.book.title)}</b><span>${esc(s.book.author)}</span></div></div><div class="face back"><div class="endpaper"><div class="bookplate">Ex libris<br><b>${esc(S.name)}</b><br>read at ${esc(VENUES[s.venue].name)}</div></div></div>`;
  book.append(leaf); setTimeout(() => sfx('open'), 350);
  setTimeout(() => { leaf.style.transform = `rotateY(${spread ? -180 : -165}deg)`; if (!spread) leaf.style.opacity = '0'; }, 500);
  setTimeout(() => { leaf.remove(); flipping = false; }, 1700);
}
function bindGestures(book) {
  let x0 = null, y0 = 0, t0 = 0;
  book.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; t0 = Date.now(); });
  book.addEventListener('pointerup', e => {
    if (x0 == null) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { turn(dx < 0 ? 1 : -1); return; }
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && Date.now() - t0 < 400) { const r = book.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width; if (fx > .62) turn(1); else if (fx < .38) turn(-1); }
  });
}
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (view === 'session' && sess && !flipping) { sess.hist = []; layoutBook(); } }, 250); });
function updHud() {
  const s = sess; if (!s || !$('#mini')) return;
  const v = VENUES[s.venue], frac = 1 - s.elapsed / s.total;
  $('#left').textContent = fmt(s.total - s.elapsed);
  $('#st-pts').textContent = '+' + s.earned; $('#st-pg').textContent = s.pagesRead; $('#st-today').textContent = S.todayMin;
  $('#st-brk').textContent = s.nextBreak < s.total - 60 ? fmt(s.nextBreak - s.elapsed) : 'none';
  const mini = $('#mini');
  if (v.timer === 'cup') {
    if (!mini.firstChild) mini.innerHTML = cupSVG(s.item, 44);
    const r = $('#liq', mini); r.setAttribute('y', 40 + 120 * (1 - frac)); r.setAttribute('height', 120 * frac);
    $('#leftlbl').textContent = `of your ${s.item.name.toLowerCase()}`;
  } else if (v.timer === 'tray') {
    const bites = s.item.bites, eaten = Math.floor((1 - frac) * bites.length);
    if (!mini.firstChild) { mini.style.width = 'auto'; mini.innerHTML = `<div class="tray">${bites.map(b => `<span>${b}</span>`).join('')}</div>`; }
    $$('.tray span', mini).forEach((sp, i) => sp.classList.toggle('gone', i < eaten));
    $('#leftlbl').textContent = `${bites.length - eaten} of ${bites.length} bites left`;
  } else {
    const C = 2 * Math.PI * 18;
    if (!mini.firstChild) mini.innerHTML = `<svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--surface-tint)" stroke-width="5"/><circle id="ring" cx="22" cy="22" r="18" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" transform="rotate(-90 22 22)"/></svg>`;
    $('#ring', mini).setAttribute('stroke-dashoffset', C * (1 - frac));
    $('#leftlbl').textContent = S.settings.hours && S.member !== 'gold' ? `until check-out · closes ${hourLabel(v.close)}` : 'until check-out';
  }
}
function cupSVG(item, w = 180) {
  return `<svg viewBox="0 0 200 190" width="${w}" height="${w * .95}" role="img" aria-label="Your ${esc(item.name)} draining as you read">
    <defs><clipPath id="cupclip"><path d="M40 40 L160 40 L148 160 Q146 170 136 170 L64 170 Q54 170 52 160 Z"/></clipPath></defs>
    <path d="M160 70 q32 0 30 30 q-2 28 -36 28" fill="none" stroke="var(--border)" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 40 L160 40 L148 160 Q146 170 136 170 L64 170 Q54 170 52 160 Z" fill="var(--surface-muted)"/>
    <rect id="liq" x="30" y="40" width="140" height="130" fill="${item.color || '#8A5A3C'}" clip-path="url(#cupclip)" style="transition:y 1s linear,height 1s linear"/>
    <path d="M40 40 L160 40 L148 160 Q146 170 136 170 L64 170 Q54 170 52 160 Z" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linejoin="round"/></svg>`;
}

/* =============== breaks, photos, finish =============== */
function staffSays(v, emoji, title, line) {
  return `<div class="say"><div class="avatar" aria-hidden="true">${v.staff.avatar}</div><div class="bubble"><b>${esc(v.staff.name)} · ${esc(v.staff.role)}</b><p class="done">${esc(line)}</p></div></div><h2 style="margin-top:16px">${emoji} ${esc(title)}</h2>`;
}
function promptBreak() {
  const v = VENUES[sess.venue];
  let list = v.breaks; if (v.id !== 'library' && sess.photos > 0) list = list.filter(b => b.id !== 'photo');
  const b = list[sess.breakIdx % list.length]; sess.breakIdx++; sess.prompt = b;
  sfx('chime'); speak(b.line, v.staff.name); document.title = `${b.emoji} Break time · BOOKOUT`;
  modal(`${staffSays(v, b.emoji, b.title, b.line)}<p class="subtle" style="margin-top:8px">${b.min} minute${b.min > 1 ? 's' : ''} · +${b.pts} points</p>
    <div class="acts"><button class="btn btn-ghost" id="skip">Skip, keep reading</button><button class="btn btn-primary" id="take">${b.id === 'photo' ? 'Take the photo' : 'Take the break'}</button></div>`, m => {
    $('#skip', m).onclick = () => { sess.prompt = null; sess.last = performance.now(); document.title = 'BOOKOUT'; closeModal(true); };
    $('#take', m).onclick = () => { sess.prompt = null; document.title = 'BOOKOUT'; closeModal(true); b.id === 'photo' ? openPhoto(true) : startBreak(b); };
  });
}
function startBreak(b) {
  sess.onBreak = { b, left: b.min * 60 }; sess.last = performance.now();
  modal(`<div class="em">${b.emoji}</div><h2>On break: ${esc(b.title.toLowerCase())}</h2><p class="muted" style="margin-top:8px">Your bookmark and timer are saved.</p>
    <div class="countdown tab" id="bcd">${fmt(b.min * 60)}</div><div class="bar"><i id="bbar" style="width:0%"></i></div>
    <div class="acts"><button class="btn btn-primary" id="back">I'm back</button></div>`, m => { $('#back', m).onclick = backFromBreak; });
}
function updBreak() { const o = sess.onBreak, t = o.b.min * 60; const c = $('#bcd'), bb = $('#bbar'); if (c) c.textContent = fmt(o.left); if (bb) bb.style.width = ((1 - o.left / t) * 100) + '%'; }
function backFromBreak() {
  const b = sess.onBreak.b; sess.onBreak = null; sess.last = performance.now(); closeModal(true);
  S.brk[b.id] = (S.brk[b.id] || 0) + 1; sess.breaks++; S.quests.brk = 1;
  earn(b.pts, b.title.toLowerCase()); questCheck(); checkBadges(); save(); updHud();
}
function finish(complete, why) {
  if (!sess) return;
  clearInterval(tickTimer);
  const s = sess, v = VENUES[s.venue];
  if (s.minuteAcc >= 30) minuteRead(s.venue);
  if (complete) {
    S.sessions++; S.finished[v.id] = (S.finished[v.id] || 0) + 1; S.quests.fin = 1;
    earn(Math.round(s.total / 60 / 2) + 10, why === 'closing' ? 'stayed until closing' : v.id === 'library' ? 'full check-in completed' : `finished your ${s.item.name.toLowerCase()}`);
    questCheck();
  }
  const badges = checkBadges(); save();
  sess = null; document.title = 'BOOKOUT';
  const headline = !complete ? 'You left early' : why === 'closing' ? 'The library is closing' : v.id === 'cafe' ? 'Last sip!' : v.id === 'diner' ? 'Clean tray!' : 'Check-out time';
  const line = v.lines.bye();
  sfx(complete ? 'win' : 'chime'); speak(line, v.staff.name);
  modal(`${staffSays(v, complete ? '🏆' : '👋', headline, line)}
    <div class="statgrid" style="margin-top:16px">
      <div class="stat"><b class="tab">${Math.round(s.elapsed / 60)}</b><span>minutes read</span></div>
      <div class="stat"><b class="tab">+${s.earned}</b><span>points earned</span></div>
      <div class="stat"><b class="tab">${s.pagesRead}</b><span>pages turned</span></div>
      <div class="stat"><b class="tab">${S.streak}</b><span>day streak</span></div>
    </div>
    ${badges.length ? `<p class="eyebrow" style="margin-top:20px">New badges</p><div class="badges" style="margin-top:8px">${badges.map(b => `<div class="bdg got"><span class="e">${b.e}</span><b>${esc(b.name)}</b></div>`).join('')}</div>` : ''}
    <div class="acts"><button class="btn btn-ghost" id="home">Back to venues</button><button class="btn btn-primary" id="again">${v.id === 'library' ? 'Check in again' : 'Order another'}</button></div>`, m => {
    $('#home', m).onclick = () => { closeModal(true); go('home'); };
    $('#again', m).onclick = () => { closeModal(true); const bk = s.book; go('setup', v.id); setup.book = bk; rerenderKeepTalk(); };
  });
}
function openPhoto(fromPrompt) {
  const s = sess; if (!s) return;
  const wasPaused = s.paused; s.paused = true;
  modal(`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Aesthetic shot</h2><button class="btn btn-ghost btn-sm" data-close>Close</button></div>
    <p class="muted" style="margin-top:6px">Add your own photo, or keep the illustrated card. Saved shots go to your Passport gallery.</p>
    <canvas id="pc" width="600" height="760" style="width:100%;max-width:320px;display:block;margin:16px auto;border-radius:6px;box-shadow:var(--e2)"></canvas>
    <div class="acts" style="justify-content:space-between"><label class="btn btn-ghost" for="pf">Use my photo<input id="pf" type="file" accept="image/*" hidden></label><button class="btn btn-primary" id="keep">Save to gallery</button></div>`, m => {
    const cv = $('#pc', m); let img = null; const draw = () => drawPolaroid(cv, s, img); draw();
    $('#pf', m).onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { const i = new Image(); i.onload = () => { img = i; draw(); }; i.src = r.result; }; r.readAsDataURL(f); };
    $('#keep', m).onclick = () => {
      burstShutter();
      try { const sm = document.createElement('canvas'); sm.width = 300; sm.height = 380; sm.getContext('2d').drawImage(cv, 0, 0, 300, 380); photos = [sm.toDataURL('image/jpeg', .75), ...photos].slice(0, 9); store('bookout:photos', photos); } catch (e) {}
      s.photos++; S.brk.photo = (S.brk.photo || 0) + 1; if (fromPrompt) { S.quests.brk = 1; s.breaks++; }
      if (s.photos <= 3) earn(5, 'aesthetic photo'); questCheck(); checkBadges(); save(); closeModal();
    };
  });
  onModalClose = () => { if (sess) { sess.paused = wasPaused; sess.last = performance.now(); } };
}
function burstShutter() { if (!S.settings.sound) return; try { const c = ac(); burst(c.currentTime, .05, { freq: 3000, vol: .3 }); burst(c.currentTime + .09, .06, { freq: 2000, vol: .25 }); } catch (e) {} }
function drawPolaroid(cv, s, img) {
  const c = cv.getContext('2d'), v = VENUES[s.venue];
  const bg = { cafe: ['#F3E6D8', '#D9B999'], library: ['#E3F8E6', '#A9E3B6'], diner: ['#FFF1C9', '#FFC870'] }[v.id];
  c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, 600, 760);
  const g = c.createLinearGradient(0, 30, 0, 600); g.addColorStop(0, bg[0]); g.addColorStop(1, bg[1]); c.fillStyle = g; c.fillRect(30, 30, 540, 560);
  if (img) { const r = Math.max(540 / img.width, 560 / img.height), w = img.width * r, h = img.height * r; c.save(); c.beginPath(); c.rect(30, 30, 540, 560); c.clip(); c.drawImage(img, 30 + (540 - w) / 2, 30 + (560 - h) / 2, w, h); c.restore(); }
  else {
    c.font = '150px serif'; c.textAlign = 'center'; c.fillText(s.item ? s.item.emoji : '📚', 210, 300);
    c.save(); c.translate(395, 300); c.rotate(-0.12); c.fillStyle = clothOf(s.book); c.fillRect(-80, -115, 160, 230); c.strokeStyle = 'rgba(245,233,200,.6)'; c.lineWidth = 2; c.strokeRect(-64, -100, 132, 200);
    c.fillStyle = '#F5E9C8'; c.font = '600 19px Literata, Georgia, serif'; c.textAlign = 'center'; wrapText(c, s.book.title, 2, -40, 120, 24, 5); c.restore();
    const txt = (s.view && s.view.L.html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 110)) || '';
    c.fillStyle = 'rgba(15,26,18,.75)'; c.font = 'italic 21px Literata, Georgia, serif'; c.textAlign = 'center'; wrapText(c, '“' + txt + (txt.length >= 110 ? '…' : '') + '”', 300, 480, 470, 28, 3);
  }
  c.textAlign = 'left'; c.fillStyle = '#0F1A12'; c.font = '600 26px Outfit, sans-serif'; c.fillText(v.name, 40, 650);
  c.fillStyle = '#5F655F'; c.font = '400 18px Outfit, sans-serif'; c.fillText(`${s.book.title.slice(0, 40)} · ${new Date().toLocaleDateString()}`, 40, 684);
  c.textAlign = 'right'; c.font = '800 22px Outfit, sans-serif'; const ow = c.measureText('OUT').width; c.fillStyle = '#1CBB6C'; c.fillText('BOOK', 560 - ow, 728); c.fillStyle = '#262828'; c.fillText('OUT', 560, 728);
}
function wrapText(c, text, x, y, maxW, lh, maxLines) {
  const words = text.split(' '); let line = '', n = 0;
  for (const w of words) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { c.fillText(line, x, y); y += lh; line = w; if (++n >= maxLines) return; } else line = t; }
  c.fillText(line, x, y);
}

/* =============== passport =============== */
function renderPassport(el) {
  const L = levelInfo(S.xp);
  el.innerHTML = `
  <div style="margin-block:12px 28px"><span class="eyebrow">Your reading passport</span><h1 style="margin-top:6px;font-size:clamp(32px,4.2vw,48px);letter-spacing:-.02em">${esc(S.name)}</h1></div>
  <div class="pp-grid">
    <div style="display:grid;gap:24px">
      <div class="member"><div class="tier">${esc(TIERS[S.member].name)} member · ${esc(TIERS[S.member].perk)}</div><div class="nm">Level ${L.lvl} · ${esc(L.title)}</div>
        <div><div class="row"><span>${S.points} points to spend</span><span class="tab">${L.into}/${L.need} XP</span></div><div class="bar"><i style="width:${(L.into / L.need * 100).toFixed(1)}%"></i></div></div></div>
      <div class="card"><div class="statgrid">
        <div class="stat"><b class="tab">${S.minutes}</b><span>minutes read</span></div><div class="stat"><b class="tab">${S.pages}</b><span>pages turned</span></div>
        <div class="stat"><b class="tab">${S.sessions}</b><span>sessions finished</span></div><div class="stat"><b class="tab">${S.best}</b><span>best streak</span></div></div></div>
      <div class="card"><h3 style="font-size:20px;margin-bottom:16px">Venue stamps</h3><div class="stamps">${Object.values(VENUES).map(v => `<div class="stamp ${S.visits[v.id] ? 'got' : ''}"><div><span class="e">${S.visits[v.id] ? v.emoji : '·'}</span>${esc(v.name)}<br>${S.visits[v.id] ? `×${S.visits[v.id]}` : 'not yet'}</div></div>`).join('')}</div></div>
      <div class="card">
        <h3 style="font-size:20px;margin-bottom:8px">Settings</h3>
        <form id="nf" class="field"><label for="nm">Your name (the staff will greet you)</label><div class="search"><input id="nm" value="${esc(S.name)}" maxlength="24"><button class="btn btn-ghost">Save</button></div></form>
        <label class="toggle" for="t-sound"><span>Sound effects</span><input type="checkbox" id="t-sound" ${S.settings.sound ? 'checked' : ''}></label>
        <label class="toggle" for="t-amb"><span>Venue background sound</span><input type="checkbox" id="t-amb" ${S.settings.ambient ? 'checked' : ''}></label>
        <label class="toggle" for="t-voice"><span>Staff speak out loud</span><input type="checkbox" id="t-voice" ${S.settings.voice ? 'checked' : ''}></label>
        <label class="toggle" for="t-hours"><span>Realistic opening hours</span><input type="checkbox" id="t-hours" ${S.settings.hours ? 'checked' : ''}></label>
        <label class="toggle" for="t-demo"><span>Demo speed (time runs 30× faster)</span><input type="checkbox" id="t-demo" ${S.settings.speed > 1 ? 'checked' : ''}></label>
        <div style="margin-top:16px"><button class="btn btn-ghost btn-sm" id="reset">Reset all progress</button></div>
      </div>
    </div>
    <div style="display:grid;gap:24px">
      <div class="card"><div class="section-head" style="margin-bottom:16px"><h3 style="font-size:20px">Badges</h3><span class="subtle">${Object.keys(S.badges).length} of ${BADGES.length}</span></div>
        <div class="badges">${BADGES.map(b => `<div class="bdg ${S.badges[b.id] ? 'got' : 'locked'}"><span class="e">${b.e}</span><b>${esc(b.name)}</b><span>${esc(b.d)}</span></div>`).join('')}</div></div>
      <div class="card"><h3 style="font-size:20px;margin-bottom:16px">Gallery</h3>${photos.length ? `<div class="gallery">${photos.map(p => `<img src="${p}" alt="Saved venue photo">`).join('')}</div>` : '<p class="subtle">No photos yet. The staff will tell you when the light is right.</p>'}</div>
      <div class="card"><h3 style="font-size:20px;margin-bottom:12px">On loan from the library</h3>${S.borrowed.length ? `<div class="borrow-list">${S.borrowed.map(b => `<div class="borrow-row"><span>${esc(b.title)}</span><span class="subtle" style="flex:none">${dayKey() > b.due ? '<b style="color:var(--danger)">overdue</b>' : 'due ' + esc(b.due)}</span></div>`).join('')}</div>` : '<p class="subtle">Nothing borrowed. Visit The Commons Library.</p>'}</div>
    </div>
  </div>`;
  $('#nf', el).onsubmit = e => { e.preventDefault(); S.name = $('#nm', el).value.trim() || 'Reader'; save(); toast('Name saved'); render(); };
  const tg = (id, fn) => $(id, el).onchange = e => { fn(e.target.checked); save(); renderChips(); };
  tg('#t-sound', v => S.settings.sound = v); tg('#t-amb', v => S.settings.ambient = v);
  tg('#t-voice', v => { S.settings.voice = v; if (v) speak(`Hello ${S.name}! I will read out what the staff say.`, 'Aina'); });
  tg('#t-hours', v => S.settings.hours = v); tg('#t-demo', v => S.settings.speed = v ? 30 : 1);
  $('#reset', el).onclick = () => modal(`<div class="em">🧹</div><h2>Reset everything?</h2><p class="muted" style="margin-top:8px">Points, badges, streaks, borrowed books and photos on this device will be erased. This cannot be undone.</p><div class="acts"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger" id="ok">Erase my progress</button></div>`,
    m => { $('#ok', m).onclick = () => { S = fresh(); photos = []; save(); store('bookout:photos', []); closeModal(); render(); }; });
}

render();
})();
</script>
