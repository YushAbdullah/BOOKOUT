name: Fetch books

# Copies free Project Gutenberg books, open AI lessons and Wikipedia articles into the site so they open instantly.
# Run it by hand (Actions > Fetch books > Run workflow) on any branch to fill that branch's shelves.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - books/picks.json
      - books/build.py
      - books/open_sources.py
      - .github/workflows/fetch-books.yml
  schedule:
    - cron: "0 3 1 * *"   # refresh once a month

permissions:
  contents: write

concurrency:
  group: fetch-books
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download books
        run: python3 -u books/build.py
      - name: Commit new books
        run: |
          git config user.name "bookout-librarian"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update library books"
          # the branch may have moved while books were downloading (e.g. a PR merged), so catch up first
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "$BR" && git push origin "HEAD:$BR" && exit 0
            sleep $((i * 5))
          done
          exit 1
